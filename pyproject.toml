
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "third-agent"
version = "0.1.0"
description = "AI-powered e-commerce support assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "alembic>=1.14",
    "mcp[cli]<2",
    "langgraph",
    "pydantic",
    "langgraph-checkpoint-postgres",
    "fastapi",
    "uvicorn",
    "pyjwt",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

